<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile">
      <rect id="tile-shape" width="256" height="256" rx="57" />
    </clipPath>
    <linearGradient id="midnight" x2="1" y2="1">
      <stop stop-color="#101631" />
      <stop offset="1" stop-color="#23143b" />
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".55">
      <stop stop-color="#3a3973" />
      <stop offset="1" stop-color="#242857" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbit" x1="46" y1="173" x2="224" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29e5c1" />
      <stop offset=".48" stop-color="#35b9ff" />
      <stop offset="1" stop-color="#ac73ff" />
    </linearGradient>
    <linearGradient id="letter" x1="116" y1="80" x2="145" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edfff9" />
      <stop offset=".52" stop-color="#b8e8ff" />
      <stop offset="1" stop-color="#c2a4ff" />
    </linearGradient>
    <linearGradient id="ember" x1="0" x2="1" y2="1">
      <stop stop-color="#ffda85" />
      <stop offset="1" stop-color="#ff785d" />
    </linearGradient>
    <path id="z" d="M88 91h80l-80 74h80" />
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#midnight)" />
    <rect width="256" height="256" fill="url(#halo)" />
  </g>

  <g id="mark">
    <path
      d="M52 142c-12-20 3-47 33-67 43-28 100-31 126-4 25 26 4 66-36 96-38 28-88 40-118 26-13-6-19-15-17-25"
      fill="none"
      stroke="url(#orbit)"
      stroke-width="13"
      stroke-linecap="round"
    />
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#z" stroke="#272654" stroke-width="36" />
      <use href="#z" stroke="url(#letter)" stroke-width="25" />
    </g>
    <circle cx="211" cy="71" r="11" fill="url(#ember)" />
  </g>
</svg>
